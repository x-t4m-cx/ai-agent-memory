spring:
  application:
    name: user-project-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_project_db}
    username: ${DB_USERNAME:user_project_app}
    password: ${USER_PROJECT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml