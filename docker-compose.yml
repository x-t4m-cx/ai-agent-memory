services:
  embedding-service:
    build:
      context: ./services/embedding-service
      dockerfile: Dockerfile
    container_name: ai-memory-embedding
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8001}:8000"
    environment:
      EMBEDDING_SERVICE_NAME: embedding-service
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_MODEL_REPO_ID: raludi/bge-m3-onnx-int8
      EMBEDDING_MODEL_DIMENSION: 1024
      EMBEDDING_MAX_SEQUENCE_LENGTH: 512
      EMBEDDING_DEVICE: cpu
      EMBEDDING_INTRA_OP_NUM_THREADS: 2
      EMBEDDING_INTER_OP_NUM_THREADS: 1
      HF_HOME: /models/huggingface
    volumes:
      - embedding_model_cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - ai-memory-network
  postgres:
    image: postgres:17.12-alpine
    container_name: ai-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      USER_PROJECT_DB_PASSWORD: ${USER_PROJECT_DB_PASSWORD}
      EMBEDDING_DB_PASSWORD: ${EMBEDDING_DB_PASSWORD}
      ANONYMIZATION_DB_PASSWORD: ${ANONYMIZATION_DB_PASSWORD}
      CONVERSATION_MEMORY_DB_PASSWORD: ${CONVERSATION_MEMORY_DB_PASSWORD}
      SEARCH_WARMUP_DB_PASSWORD: ${SEARCH_WARMUP_DB_PASSWORD}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-memory-network

  qdrant:
    image: qdrant/qdrant:v1.20.1
    container_name: ai-memory-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-memory-network

  kafka:
    image: apache/kafka:4.4.0
    container_name: ai-memory-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ai-memory-network

volumes:
  postgres_data:
  qdrant_data:
  kafka_data:
  embedding_model_cache:

networks:
  ai-memory-network:
    driver: bridge
